<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherNow</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background animated blobs -->
    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>
    <div class="bg-blob blob3"></div>

    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <i class="fas fa-cloud-sun logo-icon"></i>
          <span class="logo-text">WeatherNow</span>
        </div>
        <p class="tagline">Real-time weather at your fingertips</p>
      </header>

      <!-- Search Section -->
      <div class="search-wrapper">
        <div class="search-box">
          <i class="fas fa-search search-icon"></i>
          <input
            type="text"
            id="cityInput"
            class="search-input"
            placeholder="Search for a city..."
            autocomplete="off"
          />
          <button class="search-btn" id="searchBtn">
            <span>Search</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
        <p class="search-hint">Try: Mumbai, London, New York, Tokyo</p>
      </div>

      <!-- Error Message -->
      <div class="error-box" id="errorBox">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMsg">City not found. Please try again.</span>
      </div>

      <!-- Loading Spinner -->
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Fetching weather data...</p>
      </div>

      <!-- Weather Card -->
      <div class="weather-card" id="weatherCard">
        <!-- Top Section: City + Date -->
        <div class="card-top">
          <div class="city-info">
            <h2 class="city-name" id="cityName">--</h2>
            <p class="date-time" id="dateTime">--</p>
          </div>
          <div class="weather-icon-wrap">
            <img src="" alt="weather icon" id="weatherIcon" class="weather-icon" />
          </div>
        </div>

        <!-- Temperature -->
        <div class="temp-section">
          <h1 class="temperature" id="temperature">--°C</h1>
          <p class="weather-desc" id="weatherDesc">--</p>
          <p class="feels-like">
            Feels like: <span id="feelsLike">--</span>°C
          </p>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Stats Grid -->
        <div class="stats-grid">
          <div class="stat-card">
            <i class="fas fa-droplet stat-icon"></i>
            <div class="stat-info">
              <p class="stat-label">Humidity</p>
              <p class="stat-value" id="humidity">--%</p>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-wind stat-icon"></i>
            <div class="stat-info">
              <p class="stat-label">Wind Speed</p>
              <p class="stat-value" id="windSpeed">-- km/h</p>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-eye stat-icon"></i>
            <div class="stat-info">
              <p class="stat-label">Visibility</p>
              <p class="stat-value" id="visibility">-- km</p>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-gauge stat-icon"></i>
            <div class="stat-info">
              <p class="stat-label">Pressure</p>
              <p class="stat-value" id="pressure">-- hPa</p>
            </div>
          </div>
        </div>

        <!-- Footer Note -->
        <p class="card-footer">
          <i class="fas fa-circle-info"></i> Data from Open-Meteo & Geocoding API
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
